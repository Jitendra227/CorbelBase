services:
  postgres:
    image: postgres:18
    container_name: teamops-postgres
    environment:
      POSTGRES_USER: teamops@345
      POSTGRES_PASSWORD: teamops@db45auth
      POSTGRES_DB: teamops@987
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: teamops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: